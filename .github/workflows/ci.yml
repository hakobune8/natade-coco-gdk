name: Game CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      image_repository:
        description: Untagged OCI repository
        required: true
        type: string
      image_digest:
        description: Registry-reported sha256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.14.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install exact dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enforce source-security contract
        env:
          SUPPLY_CHAIN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make security-check
      - name: Reject moderate or higher dependency vulnerabilities
        run: pnpm audit --audit-level moderate

  validate:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.10" }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.14.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: make setup
      - run: make validate
      - run: make test
      - run: make lint
      - run: make build

  supply-chain:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: gdk-reference:ci
          build-args: |
            VERSION=0.11.2
            REVISION=${{ github.sha }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOMs
        run: |
          mkdir -p supply-chain
          syft gdk-reference:ci -o spdx-json=supply-chain/sbom.spdx.json
          syft gdk-reference:ci -o cyclonedx-json=supply-chain/sbom.cyclonedx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gdk-reference:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: supply-chain/trivy.json
          version: v0.72.0
      - name: Print vulnerability diagnostics
        if: ${{ failure() }}
        run: |
          if test -f supply-chain/trivy.json; then
            jq '[.Results[]? | {Target, Vulnerabilities: [.Vulnerabilities[]? | {VulnerabilityID, PkgName, InstalledVersion, FixedVersion, Severity}]}]' supply-chain/trivy.json
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdk-reference-supply-chain
          path: supply-chain/
          retention-days: 30

  codeql:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript,go
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  release-attestation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [validate, supply-chain, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the matching immutable release tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v${version}"
      - name: Generate and verify release attestation
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          make release-attestation
          make release-attestation-check ATTESTATION=dist/natadecoco-release-attestation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natadecoco-release-attestation
          path: dist/natadecoco-release-attestation.json
          if-no-files-found: error
          retention-days: 90
