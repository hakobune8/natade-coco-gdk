name: Game CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      image_repository:
        description: Untagged OCI repository
        required: true
        type: string
      image_digest:
        description: Registry-reported sha256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.14.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install exact dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enforce source-security contract
        env:
          SUPPLY_CHAIN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make security-check
      - name: Reject moderate or higher dependency vulnerabilities
        run: pnpm audit --audit-level moderate

  validate:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.26.7" }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.14.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: make setup
      - run: make validate
      - run: make test
      - run: make lint
      - run: make build

  supply-chain:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: gdk-reference:ci
          build-args: |
            VERSION=0.9.0
            REVISION=${{ github.sha }}
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SBOMs
        run: |
          mkdir -p supply-chain
          syft gdk-reference:ci -o spdx-json=supply-chain/sbom.spdx.json
          syft gdk-reference:ci -o cyclonedx-json=supply-chain/sbom.cyclonedx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gdk-reference:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: json
          output: supply-chain/trivy.json
          version: v0.72.0
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdk-reference-supply-chain
          path: supply-chain/
          retention-days: 30

  codeql:
    needs: source-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript,go
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  release-attestation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [validate, supply-chain, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the matching immutable release tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v${version}"
      - name: Generate and verify release attestation
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          make release-attestation
          make release-attestation-check ATTESTATION=dist/natadecoco-release-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natadecoco-release-attestation
          path: dist/natadecoco-release-attestation.json
          if-no-files-found: error
          retention-days: 90
